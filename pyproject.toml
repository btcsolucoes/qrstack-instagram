[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qrstack-instagram"
version = "0.1.0"
description = "Restricted instagrapi fork for controlled QrStack story tests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "curl_cffi>=0.15.0", "requests>=2.34.2,<3", "PySocks>=1.7.1,<2",
  "pydantic>=2.12.5,<2.14", "Pillow>=12.2.0,<13",
  "pycryptodomex==3.23.0", "cryptography>=46,<51"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
qrstack-instagram = "qrstack_instagram.cli:main"
qrstack-instagram-platform = "qrstack_instagram.platform:main"

[tool.setuptools.packages.find]
include = ["instagrapi*", "qrstack_instagram*"]

[tool.pytest.ini_options]
testpaths = ["tests_qrstack"]
